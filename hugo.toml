baseURL = "/"
relativeURLs = true
title = "Spatial Science and Urban Systems"
disableKinds = ["taxonomy", "term"]
enableRobotsTXT = true

# Only News carries a feed (content/news/_index.md asks for one); the other
# sections' pages are undated, so their feeds would date every item year 1.
[outputs]
  home = ["html"]
  section = ["html"]

# News reads each package's releases.atom at build time; refetch after six hours.
[caches]
  [caches.getresource]
    dir = ":cacheDir/:project"
    maxAge = "6h"

# static/img is also mounted under assets/, so a page's figure can be resized
# into its link preview; declaring a mount replaces the defaults, so both
# defaults are restated.
[module]
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "static/img"
    target = "assets/img"

[params]
  university = "UC Irvine"
  tagline = "Spatial methods for urban processes, open science for public decisions."
  statement = "We study the spatial organization of neighborhoods, cities, and regions."
  department = "Department of Urban Planning and Public Policy"
  github = "https://github.com/ssus-lab"
  director = "Elijah Knaap"
  googleAnalyticsID = "G-VN9V62G43D"

[menus]
  [[menus.main]]
    name = "Projects"
    pageRef = "/projects"
    weight = 10
  [[menus.main]]
    name = "Publications"
    pageRef = "/publications"
    weight = 20
  [[menus.main]]
    name = "Software"
    pageRef = "/software"
    weight = 30
  [[menus.main]]
    name = "News"
    pageRef = "/news"
    weight = 35
  [[menus.main]]
    name = "People"
    pageRef = "/people"
    weight = 40
  [[menus.main]]
    name = "Contact"
    pageRef = "/contact"
    weight = 50

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
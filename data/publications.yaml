# Selected publications, newest first. Titles, authors, and DOIs checked against
# Crossref; years are the journal issue years. `home: true` puts an entry on
# the home page (the first four flagged show). `date` (YYYY-MM-DD: publication
# for articles, acceptance for forthcoming) adds the entry to News. `page` names
# the project or software page it belongs to, which then lists it.
# A working paper's `url` (a preprint) links it there.


{{/*
  Research-area icons, drawn in the mark's idiom: nodes, ties, cells.
  Pass the icon name: "sorting", "methods", or "inequality". Colored by currentColor.
*/}}
{{ $name := . }}
<svg class="icon" viewBox="0 0 48 48" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
{{ if eq $name "sorting" }}
  {{/* Two clusters that have sorted apart: one filled, one open. */}}
  <path d="M8 15 L17 10 M8 15 L14 25 M17 10 L14 25 M14 25 L7 33" opacity=".7"/>
  <path d="M33 16 L41 12 M33 16 L37 27 M41 12 L37 27 M37 27 L42 36" opacity=".7"/>
  <g fill="currentColor"><circle cx="8" cy="15" r="3.4"/><circle cx="17" cy="10" r="3.4"/><circle cx="14" cy="25" r="3.4"/><circle cx="7" cy="33" r="3.4"/></g>
  <g fill="var(--icon-hole, transparent)"><circle cx="33" cy="16" r="3.4"/><circle cx="41" cy="12" r="3.4"/><circle cx="37" cy="27" r="3.4"/><circle cx="42" cy="36" r="3.4"/></g>
  <path d="M24 6 V42" stroke-dasharray="2 3.2" opacity=".55"/>
{{ else if eq $name "methods" }}
  {{/* A spatial weights matrix: sparse, symmetric, zero diagonal. */}}
  <rect x="6" y="6" width="36" height="36" rx="2" opacity=".7"/>
  <g fill="currentColor" stroke="none">
    <rect x="15.5" y="7.5" width="7" height="7"/><rect x="7.5" y="15.5" width="7" height="7"/>
    <rect x="24.5" y="15.5" width="7" height="7"/><rect x="15.5" y="24.5" width="7" height="7"/>
    <rect x="33.5" y="24.5" width="7" height="7"/><rect x="24.5" y="33.5" width="7" height="7"/>
  </g>
  <path d="M8 8 L40 40" stroke-dasharray="2 3.2" opacity=".5"/>
{{ else if eq $name "inequality" }}
  {{/* A Lorenz curve under the line of equality. */}}
  <path d="M7 41 H41 V7" opacity=".7"/>
  <path d="M7 41 L41 7" stroke-dasharray="2 3.2" opacity=".55"/>
  <path d="M7 41 C22 40 33 33 41 7" stroke-width="2.4"/>
  <circle cx="7" cy="41" r="2.6" fill="currentColor"/><circle cx="41" cy="7" r="2.6" fill="currentColor"/>
{{ end }}
</svg>
